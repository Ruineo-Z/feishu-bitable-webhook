<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow 管理台</title>
    <link rel="stylesheet" href="/ui/workflows/styles.css" />
  </head>
  <body>
    <div class="layout-overlay"></div>
    <main class="app-shell">
      <header class="hero">
        <p class="hero-kicker">Feishu Bitable Automation</p>
        <h1>Workflow 管理台</h1>
        <p class="hero-desc">
          用页面完成工作流的查询、创建、编辑与删除，减少手写 JSON 与接口调试成本。
        </p>
      </header>

      <section class="workspace">
        <section class="panel list-panel">
          <div class="panel-header">
            <h2>工作流列表</h2>
            <button id="refresh-btn" class="btn btn-ghost" type="button">刷新</button>
          </div>

          <div class="toolbar">
            <label>
              状态筛选
              <select id="status-filter">
                <option value="all">全部</option>
                <option value="true">仅启用</option>
                <option value="false">仅禁用</option>
              </select>
            </label>
            <label>
              每页条数
              <select id="limit-select">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
            </label>
          </div>

          <p id="list-state" class="list-state" aria-live="polite"></p>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>状态</th>
                  <th>作用域</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="workflow-table-body"></tbody>
            </table>
          </div>

          <div class="pagination">
            <button id="prev-page-btn" class="btn btn-ghost" type="button">上一页</button>
            <p id="page-info">第 1 页 / 共 1 页（共 0 条）</p>
            <button id="next-page-btn" class="btn btn-ghost" type="button">下一页</button>
          </div>
        </section>

        <section class="panel form-panel">
          <div class="panel-header">
            <h2 id="form-title">新建工作流</h2>
            <button id="create-new-btn" class="btn btn-ghost" type="button">切换到新建</button>
          </div>

          <p id="feedback" class="feedback" aria-live="polite"></p>

          <form id="workflow-form" novalidate>
            <label>
              工作流名称
              <input id="workflow-name" name="name" type="text" placeholder="例如：状态变更通知" required />
            </label>

            <label class="switch">
              <input id="workflow-active" name="isActive" type="checkbox" checked />
              <span>启用该工作流</span>
            </label>

            <label>
              作用域类型（仅 table）
              <select id="scope-type" name="scopeType">
                <option value="table">table（绑定指定数据表）</option>
              </select>
            </label>

            <div id="scope-binding-fields" class="scope-grid">
              <label>
                appToken
                <input id="scope-app-token" name="appToken" type="text" placeholder="KaWjbBvGeaG0Fus5bwWcKLsJnfb" />
              </label>

              <label>
                tableId
                <input id="scope-table-id" name="tableId" type="text" placeholder="tblhV7wQW9uqdkMd" />
              </label>
            </div>

            <label>
              工作流 DSL（JSON）
              <textarea
                id="workflow-config"
                name="config"
                rows="16"
                spellcheck="false"
                placeholder="请输入符合后端 schema 的 JSON"
              ></textarea>
            </label>

            <div class="form-actions">
              <button id="submit-btn" class="btn btn-primary" type="submit">创建工作流</button>
              <button id="reset-form-btn" class="btn btn-ghost" type="button">重置表单</button>
            </div>
          </form>
        </section>
      </section>
    </main>

    <script type="module" src="/ui/workflows/app.js"></script>
  </body>
</html>
